<title>My Misconceptions</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one misconception per screen. Red 'you thought' box, then the right picture, the gaps, the trap, the retry. */
:root{
  --bg:#f4f6f9; --surface:#ffffff; --ink:#141b26; --muted:#4f5a6b; --line:#cfd6e0;
  --accent:#0d6c78; --accent-soft:#dcf0f2; --good:#17773a; --good-soft:#e1f3e7; --bad:#b3332a; --bad-soft:#fbe3e0;
  --display:"Space Grotesk",system-ui,sans-serif; --body:"Atkinson Hyperlegible",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141b; --surface:#18202b; --ink:#eef2f7; --muted:#a8b2c1; --line:#2d3846;
  --accent:#55c6d2; --accent-soft:#15343a; --good:#63d48b; --good-soft:#14301f; --bad:#f2857a; --bad-soft:#3a1e1b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#18202b; --ink:#eef2f7; --muted:#a8b2c1; --line:#2d3846;
  --accent:#55c6d2; --accent-soft:#15343a; --good:#63d48b; --good-soft:#14301f; --bad:#f2857a; --bad-soft:#3a1e1b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:20px/1.45 var(--body)}
.wrap{max-width:820px;margin:0 auto;padding-block:16px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
p{margin:0}
code{font-family:var(--mono);font-size:.85em;background:var(--accent-soft);padding:0 5px;border-radius:5px;overflow-wrap:anywhere}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.8rem;color:var(--muted)}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots button{width:14px;height:14px;border-radius:50%;border:0;background:var(--line);padding:0;cursor:pointer}
.dots button.on{background:var(--accent)}
.chip{font:700 .8rem var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.rule{font:700 clamp(1.7rem,5.4vw,2.6rem)/1.12 var(--display);text-wrap:balance;margin:0}
.rule .arrow{color:var(--accent)}
.pic{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;overflow-x:auto}
.flow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.b{border:3px solid var(--line);border-radius:12px;padding:10px 14px;font:700 1.05rem var(--display);text-align:center;background:var(--bg)}
.b small{display:block;font:400 .8rem var(--body);color:var(--muted)}
.b.g{border-color:var(--good);background:var(--good-soft)}
.b.r{border-color:var(--bad);background:var(--bad-soft)}
.b.a{border-color:var(--accent);background:var(--accent-soft)}
.ar{font:700 1.6rem var(--display);color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.cols>.b{display:flex;flex-direction:column;gap:4px;justify-content:center}
.big{font:700 1.3rem var(--display)}
.why{font-size:1.15rem;border-left:6px solid var(--accent);padding:4px 0 4px 14px}
.why b{color:var(--accent)}
.ex{display:grid;grid-template-columns:1fr;gap:8px}
.ex .q{font-size:1rem;color:var(--muted)}
.ex .ans{font:700 1.15rem var(--display);color:var(--good)}
.trap{background:var(--bad-soft);border-radius:12px;padding:12px 14px;font-size:1.02rem}
.trap b{color:var(--bad)}
.teach{border:3px dashed var(--accent);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.teach .t{font:700 1.1rem var(--display)}
.teach p{font-size:1.05rem}
.btn{font:700 1.05rem var(--body);padding:12px 18px;border-radius:12px;border:2px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer}
.btn.alt{background:transparent;color:var(--ink)}
.btn:focus-visible,.dots button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:2px solid var(--line);display:flex;justify-content:space-between;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.nav .btn{flex:1;max-width:260px}
.sec{font:700 .78rem var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.you{background:var(--bad-soft);border:3px solid var(--bad);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.you .big{color:var(--bad)}
.you q{font-size:1rem;color:var(--muted);font-style:italic}
.gap{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.gap li{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 14px;font-size:1.05rem}
.gap li b{color:var(--good)}
.ok{background:var(--good-soft);border-radius:12px;padding:10px 14px;font-size:1rem}
.code{font:500 .85rem/1.5 var(--mono);text-align:left;white-space:pre;overflow-x:auto;margin:0}
.empty{font-size:1.2rem;color:var(--muted)}
</style>

<div class="wrap">
  <div class="topbar"><span class="chip">Round 2: fix my thinking</span><span id="count"></span></div>
  <div class="dots" id="dots"></div>
  <main id="slide" style="display:flex;flex-direction:column;gap:18px"></main>
</div>
<nav class="nav"><button class="btn alt" id="prev" type="button">← Back</button><button class="btn" id="next" type="button">Next →</button></nav>

<script>
/* One entry per failed teach-back. Add new entries at the end.
   n: topic | you: user's words (short) | wrong: the belief in one line | rule: the right rule
   pic: diagram html | gap: missing pieces | ok: what was right | trap: exam trap | retry: questions */
const M=[
{n:"stop_reason loop",
 you:"The API forgets, so my code loops to retry when a call fails.",
 wrong:"The loop exists to retry failures.",
 rule:'Claude asks for a tool <span class="arrow">→</span> YOUR code runs it <span class="arrow">→</span> send it all back',
 pic:`<div class="flow"><div class="b a">Your code<small>sends FULL history</small></div><span class="ar">→</span><div class="b">Claude<small>replies + stop_reason</small></div></div>
<div class="cols">
<div class="b a"><span class="big">tool_use</span><small>Your code runs the tool. Add tool_result to history. Send again. LOOP.</small></div>
<div class="b g"><span class="big">end_turn</span><small>Claude is done. STOP the loop.</small></div>
<div class="b r"><span class="big">max_tokens</span><small>Answer cut off. Raise the limit or continue.</small></div>
</div>`,
 gap:["<b>Claude cannot run tools.</b> It only asks. Your code runs the tool.",
      "<b>The loop is for tool calls,</b> not for failures.",
      "<b>Your code sends the full history</b> each time. That is how Claude knows 3 of 10 are done."],
 ok:"Right: the API keeps no memory between calls. SAME SLIP AGAIN in the tool_result teach-back: “Claude just uses the tool.” No: Claude asks, your code runs it.",
 trap:"Stop when Claude's text says “done”. WRONG. Stop when <code>stop_reason == \"end_turn\"</code>.",
 retry:["Who runs the tool?","What does your code send back?","Which stop_reason ends the loop?"]},
{n:"Task tool + allowedTools",
 you:"Spawn them all at once because research tasks are independent.",
 wrong:"Parallel is only about the tasks being independent.",
 rule:'3 Task calls in ONE reply <span class="arrow">→</span> run in parallel',
 pic:`<div class="flow"><div class="b a">Coordinator<small>allowedTools: ["Task", …]</small></div><span class="ar">→</span><div class="b g">ONE reply<small>Task A · Task B · Task C</small></div><span class="ar">→</span><div class="b">3 subagents run together<small>each starts with an EMPTY context</small></div></div>
<div class="cols">
<div class="b r"><span class="big">Across 3 turns</span><small>Turn 1: Task A, wait. Turn 2: Task B, wait. Turn 3: Task C. Total time = A + B + C.</small></div>
<div class="b g"><span class="big">In 1 turn</span><small>Task A + B + C in the same reply. Total time = the slowest one.</small></div>
<div class="b r"><span class="big">No "Task" in allowedTools</span><small>The coordinator cannot spawn ANY subagent.</small></div>
</div>`,
 gap:["<b>The HOW:</b> the coordinator puts several Task tool calls in ONE response. That is what makes them parallel.",
      "<b>Why turns are slow:</b> each turn waits for the last subagent to finish. Sequential time adds up.",
      "<b>allowedTools must include \"Task\".</b> Without it, the coordinator cannot spawn anything. You did not mention this.",
      "<b>Subagents inherit nothing.</b> Put every fact they need in the Task prompt."],
 ok:"Right: independent research has no dependency, so it can run in parallel.",
 trap:"“Coordinator never starts a subagent.” Fix: add <code>\"Task\"</code> to allowedTools. Not: rewrite the prompt.",
 retry:["How does the coordinator start 3 subagents at the same time?","What must be in its allowedTools?","What does a subagent know when it starts?"]},
{n:"JSON schema (tool input)",
 you:"Required makes it invent a value. But what does the JSON even look like? Where does it go?",
 wrong:"Why: correct. Gap: you could not picture the JSON.",
 rule:'The schema is a FORM Claude fills in. No “blank” option <span class="arrow">→</span> Claude invents',
 pic:`<div class="b a"><span class="sec">1. You write the tool (the form)</span><pre class="code">{ "name": "save_invoice",
  "input_schema": {
    "type": "object",
    "properties": {
      "total":    { "type": "number" },
      "due_date": { "type": ["string", "null"] }
    },
    "required": ["total", "due_date"] } }</pre></div>
<div class="flow"><span class="ar">↓</span><div class="b">tool_choice forces save_invoice<small>Claude MUST fill the form</small></div><span class="ar">↓</span></div>
<div class="b a"><span class="sec">2. Claude replies with a tool_use block (the filled form)</span><pre class="code">{ "total": 412.50, "due_date": null }</pre></div>
<div class="flow"><span class="ar">↓</span><div class="b">3. YOUR code gets the JSON<small>validate it, then save to Postgres</small></div></div>
<div class="cols">
<div class="b r"><span class="big">required, NOT nullable</span><small>No due date on the invoice. The form still wants a string. Claude writes "2026-01-01". Invented.</small></div>
<div class="b g"><span class="big">required + nullable</span><small>Claude writes null. Honest.</small></div>
<div class="b g"><span class="big">enum + "other"</span><small>Plus a detail field. The new category fits without a forced wrong pick.</small></div>
</div>`,
 gap:["<b>The schema is the tool's input_schema.</b> It is the form Claude must fill when it calls the tool.",
      "<b>Claude's output IS the JSON.</b> Force the tool with tool_choice, and you get structured data back. That is how extraction works.",
      "<b>Your code gets the JSON.</b> Validate it (for example with Pydantic). Then store it.",
      "<b>strict / schema = right SHAPE, not right VALUES.</b> A valid date can still be the wrong date."],
 ok:"Right: required with no exit forces Claude to invent. Your phone-number example is correct.",
 trap:"“Schema guarantees the data is correct.” WRONG. It guarantees the format only. Values still need checks.",
 retry:["What is the schema, in one sentence?","Where does Claude's JSON go after it replies?","Why does nullable stop invented values?"]}
];

let i=0;
const $=id=>document.getElementById(id);
function render(){
  $("count").textContent=M.length?`${i+1} / ${M.length}`:"";
  $("dots").innerHTML=M.map((_,k)=>`<button type="button" aria-label="Item ${k+1}" class="${k===i?"on":""}" data-k="${k}"></button>`).join("");
  $("dots").querySelectorAll("button").forEach(b=>b.onclick=()=>go(+b.dataset.k));
  if(!M.length){$("slide").innerHTML='<p class="empty">No misconceptions logged yet.</p>';return}
  const m=M[i];
  $("slide").innerHTML=`<span class="chip">${m.n}</span>
<div class="you"><span class="sec">You thought</span><span class="big">${m.wrong}</span><q>${m.you}</q></div>
<span class="sec">Actually</span>
<h1 class="rule">${m.rule}</h1>
<div class="pic">${m.pic}</div>
<span class="sec">What was missing</span>
<ul class="gap">${m.gap.map(g=>`<li>${g}</li>`).join("")}</ul>
<p class="ok">${m.ok}</p>
<p class="trap"><b>Exam trap:</b> ${m.trap}</p>
<div class="teach"><span class="t">Try again</span><p>Answer in 3 short sentences:</p><ol>${m.retry.map(r=>`<li>${r}</li>`).join("")}</ol><div><button class="btn" id="copy" type="button">Copy prompt for chat</button> <span id="copied" class="sec"></span></div></div>`;
  $("copy").onclick=()=>{const t=`Teach-back round 2, ${m.n}: ${m.retry.join(" ")}\nMy answer: `,c=$("copied");
    navigator.clipboard.writeText(t).then(()=>c.textContent="Copied. Paste in chat and add your answer.").catch(()=>c.textContent="Copy blocked. Type the topic name in chat with your answer.")};
}
function go(k){i=Math.max(0,Math.min(M.length-1,k));render();try{history.replaceState(null,"","#m"+i)}catch(e){}window.scrollTo(0,0)}
$("prev").onclick=()=>go(i-1);$("next").onclick=()=>go(i+1);
addEventListener("keydown",e=>{if(e.key==="ArrowRight")go(i+1);if(e.key==="ArrowLeft")go(i-1)});
const h=location.hash.match(/^#m(\d+)$/);go(h?+h[1]:0);
</script>

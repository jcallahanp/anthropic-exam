let i=0;
const $=id=>document.getElementById(id);
function render(){
  $("count").textContent=M.length?`${i+1} / ${M.length}`:"";
  $("dots").innerHTML=M.map((_,k)=>`<button type="button" aria-label="Item ${k+1}" class="${k===i?"on":""}" data-k="${k}"></button>`).join("");
  $("dots").querySelectorAll("button").forEach(b=>b.onclick=()=>go(+b.dataset.k));
  if(!M.length){$("slide").innerHTML='<p class="empty">No misconceptions logged yet.</p>';return}
  const m=M[i];
  $("slide").innerHTML=`<span class="chip">${m.n}</span>
<div class="you"><span class="sec">You thought</span><span class="big">${m.wrong}</span><q>${m.you}</q></div>
<span class="sec">Actually</span>
<h1 class="rule">${m.rule}</h1>
<div class="pic">${m.pic}</div>
<span class="sec">What was missing</span>
<ul class="gap">${m.gap.map(g=>`<li>${g}</li>`).join("")}</ul>
<p class="ok">${m.ok}</p>
<p class="trap"><b>Exam trap:</b> ${m.trap}</p>
<div class="teach"><span class="t">Try again</span><p>Answer in 3 short sentences:</p><ol>${m.retry.map(r=>`<li>${r}</li>`).join("")}</ol><div><button class="btn" id="copy" type="button">Copy prompt for chat</button> <span id="copied" class="sec"></span></div></div>`;
  $("copy").onclick=()=>{const t=`Teach-back round 2, ${m.n}: ${m.retry.join(" ")}\nMy answer: `,c=$("copied");
    navigator.clipboard.writeText(t).then(()=>c.textContent="Copied. Paste in chat and add your answer.").catch(()=>c.textContent="Copy blocked. Type the topic name in chat with your answer.")};
}
function go(k){i=Math.max(0,Math.min(M.length-1,k));render();try{history.replaceState(null,"","#m"+i)}catch(e){}window.scrollTo(0,0)}
$("prev").onclick=()=>go(i-1);$("next").onclick=()=>go(i+1);
addEventListener("keydown",e=>{if(e.key==="ArrowRight")go(i+1);if(e.key==="ArrowLeft")go(i-1)});
const h=location.hash.match(/^#m(\d+)$/);go(h?+h[1]:0);
</script>

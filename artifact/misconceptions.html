<div class="cols">
<div class="b r"><span class="big">Across 3 turns</span><small>Turn 1: Task A, wait. Turn 2: Task B, wait. Turn 3: Task C. Total time = A + B + C.</small></div>
<div class="b g"><span class="big">In 1 turn</span><small>Task A + B + C in the same reply. Total time = the slowest one.</small></div>

    "properties": {
      "total":    { "type": "number" },
      "due_date": { "type": ["string", "null"] }

    "required": ["total", "due_date"] } }</pre></div>
<div class="flow"><span class="ar">↓</span><div class="b">tool_choice forces save_invoice<small>Claude MUST fill the form</small></div><span class="ar">↓</span></div>
<div class="b a"><span class="sec">2. Claude replies with a tool_use block (the filled form)</span><pre class="code">{ "total": 412.50, "due_date": null }</pre></div>
<div class="flow"><span class="ar">↓</span><div class="b">3. YOUR code gets the JSON<small>validate it, then save to Postgres</small></div></div>
<div class="cols">
<div class="b r"><span class="big">required, NOT nullable</span><small>No due date on the invoice. The form still wants a string. Claude writes "2026-01-01". Invented.</small></div>

 you:"Why can't I wait for the tool, append the result, and continue? It seems like only latency.",

</div>`,

{n:"MCP resource",
 you:"A resource is like a clearer tool description. It shows the schema so Claude knows what the tool returns.",

<div class="b a"><span class="big">Resource = card catalog</span><small>Read-only. Shows WHAT EXISTS: table list, DB schema, doc tree, issue list. No action happens.</small></div>
<div class="b"><span class="big">Tool = librarian</span><small>Does something: fetches one book, checks it out, writes a record. Can change things.</small></div>
</div>

      "<b>Read-only vs action.</b> Resources never do anything. Tools act and can have side effects.",
      "<b>The bug a resource fixes:</b> many exploratory tool calls to find out what exists.",
      "<b>Your schema example was a correct resource.</b> Your framing was wrong: it is not a clearer tool description. It is a catalog Claude reads before it acts."],
 ok:"Right: exposing a DB schema up front helps Claude pick the right call. That is a real resource use.",
 trap:"“Paste the whole catalog into the system prompt.” WRONG. Expose it as an MCP resource.",

{n:".mcp.json",
 you:"The token function blurs the token out and puts a placeholder in. Which part shares it with everyone?",
 wrong:"Something hides or blurs a real token in the file.",
 rule:'The file holds only <code>${GITHUB_TOKEN}</code>. Each person\'s OWN machine fills it in.',
 pic:`<div class="b a"><span class="sec">1. .mcp.json at the repo root, committed to git (SHARED)</span><pre class="code">{ "mcpServers": {

      "command": "github-mcp",

<div class="flow"><span class="ar">↓</span><div class="b">git clone<small>every teammate gets the SAME file, with the placeholder only</small></div><span class="ar">↓</span></div>
<div class="cols">

<div class="b g"><span class="big">Ben's laptop</span><small>His shell has GITHUB_TOKEN=ben_xyz. Claude Code puts ben_xyz in at startup.</small></div>
<div class="b r"><span class="big">Git</span><small>Never sees ana_abc or ben_xyz. The real token was never in the file.</small></div>
</div>`,
 gap:["<b>What shares it:</b> .mcp.json is a project-scope file. It is committed, so every clone gets the server config.",

    sds.forEach(k=>{h+=`<div class="row${by[k].length>1?" hot":""}"><span class="sd">${k}</span><div><span class="lbl">${SD[k]||""}</span> <span class="bar">${"■".repeat(by[k].length)}</span><div class="items">${by[k].map(m=>`<button type="button" data-n="${encodeURIComponent(m.n)}">${m.n}</button>`).join("")}</div></div></div>`});
    h+=`</div>`});
  const lo=M.filter(m=>m.p==="low");
  h+=`<span class="sec">Low priority · not in the guide · ${lo.length}</span><div class="dom"><div class="row"><span class="sd">skim</span><div class="items">${lo.map(m=>`<button type="button" data-n="${encodeURIComponent(m.n)}">${m.n}</button>`).join("")}</div></div></div>`;
  h+=`<span class="sec">Repeat mistakes (highest yield)</span><ul class="gap">
<li><b>Globs, 3 misses.</b> * = one level, ** = any depth. Folder scope → folder CLAUDE.md. Scattered file type → glob rule.</li>
<li><b>True-but-generic answers, 2 misses.</b> Find the key word (“independent”, “test-driven”). Pick the answer that explains THAT word.</li>
<li><b>Who runs what, 2 slips.</b> Claude only ASKS for tools; your code runs them and appends tool_result.</li>
<li><b>Subagents are not chats, 2 slips.</b> context: fork and Explore run alone and return a summary.</li></ul>`;
  return h}
function entryHTML(m){return `<div class="pri"><span class="${m.p==="high"?"h":"l"}">${m.p==="high"?"HIGH":"LOW"}</span><span>${m.sd} · ${SD[m.sd]||""}</span></div><span class="chip">${m.n}</span>
<div class="you"><span class="sec">You thought</span><span class="big">${m.wrong}</span><q>${m.you}</q></div>
<span class="sec">Actually</span>
<h1 class="rule">${m.rule}</h1>
<div class="pic">${m.pic}</div>
<span class="sec">What was missing</span>
<ul class="gap">${m.gap.map(g=>`<li>${g}</li>`).join("")}</ul>
<p class="ok">${m.ok}</p>
<p class="trap"><b>Exam trap:</b> ${m.trap}</p>
<div class="teach"><span class="t">Try again</span><p>Answer in 3 short sentences:</p><ol>${m.retry.map(r=>`<li>${r}</li>`).join("")}</ol><div><button class="btn" id="copy" type="button">Copy prompt for chat</button> <span id="copied" class="sec"></span></div></div>`}
function render(){
  document.querySelectorAll(".filt .btn").forEach(b=>b.className="btn"+(b.dataset.f===f?"":" alt"));
  $("count").textContent=i===0?"Map":`${i} / ${V.length-1}`;
  $("dots").innerHTML=V.map((v,k)=>`<button type="button" aria-label="${k?"Item "+k:"Map"}" class="${k===i?"on":""}" data-k="${k}"></button>`).join("");
  $("dots").querySelectorAll("button").forEach(b=>b.onclick=()=>go(+b.dataset.k));
  if(i===0){$("slide").innerHTML=mapHTML();
    $("slide").querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{const n=decodeURIComponent(b.dataset.n);f="all";view();go(V.findIndex(v=>v!=="map"&&v.n===n))});return}
  const m=V[i];$("slide").innerHTML=entryHTML(m);
  $("copy").onclick=()=>{const t=`Teach-back round 2, ${m.n}: ${m.retry.join(" ")}\nMy answer: `,c=$("copied");
    navigator.clipboard.writeText(t).then(()=>c.textContent="Copied. Paste in chat and add your answer.").catch(()=>c.textContent="Copy blocked. Type the topic name in chat with your answer.")};
}
function go(k){i=Math.max(0,Math.min(V.length-1,k));render();try{history.replaceState(null,"","#m"+i)}catch(e){}window.scrollTo(0,0)}
document.querySelectorAll(".filt .btn").forEach(b=>b.onclick=()=>{f=b.dataset.f;view();go(f==="all"?0:1)});
$("prev").onclick=()=>go(i-1);$("next").onclick=()=>go(i+1);
addEventListener("keydown",e=>{if(e.key==="ArrowRight")go(i+1);if(e.key==="ArrowLeft")go(i-1)});
view();const h=location.hash.match(/^#m(\d+)$/);go(h?+h[1]:0);
</script>

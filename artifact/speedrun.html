<title>Exam Speed Run</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: sticky domain tabs + search; a grid of scan-fast cards (rule, picture, cue words, trap, one tap-to-reveal drill). */
:root{
  --bg:#f4f6f9; --surface:#ffffff; --ink:#141b26; --muted:#4f5a6b; --line:#cfd6e0;
  --accent:#0d6c78; --accent-soft:#dcf0f2; --good:#17773a; --good-soft:#e1f3e7; --bad:#b3332a; --bad-soft:#fbe3e0; --warn:#8a5a00; --warn-soft:#fbefd6;
  --display:"Space Grotesk",system-ui,sans-serif; --body:"Atkinson Hyperlegible",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141b; --surface:#18202b; --ink:#eef2f7; --muted:#a8b2c1; --line:#2d3846;
  --accent:#55c6d2; --accent-soft:#15343a; --good:#63d48b; --good-soft:#14301f; --bad:#f2857a; --bad-soft:#3a1e1b; --warn:#f0c25a; --warn-soft:#3a2e12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#18202b; --ink:#eef2f7; --muted:#a8b2c1; --line:#2d3846;
  --accent:#55c6d2; --accent-soft:#15343a; --good:#63d48b; --good-soft:#14301f; --bad:#f2857a; --bad-soft:#3a1e1b; --warn:#f0c25a; --warn-soft:#3a2e12; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:19px/1.45 var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
p{margin:0}
code{font-family:var(--mono);font-size:.85em;background:var(--accent-soft);padding:0 5px;border-radius:5px;overflow-wrap:anywhere}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:2px solid var(--line)}
.topin{max-width:1180px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tab{flex:0 0 auto;font:700 .95rem var(--display);padding:9px 14px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:flex;gap:8px;align-items:center}
.tab .n{font:700 .75rem var(--body);background:var(--bad);color:var(--bg);border-radius:99px;padding:1px 7px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab:focus-visible,.search:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.search{font:400 1rem var(--body);padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.wrap{max-width:1180px;margin:0 auto;padding-block:16px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.moves{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}
.move{background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:.95rem}
.move b{font-family:var(--display)}
.dh{font:700 clamp(1.3rem,3.6vw,1.8rem)/1.15 var(--display);margin:0;text-wrap:balance}
.dh small{display:block;font:400 .95rem var(--body);color:var(--muted);margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr));gap:14px;align-items:start}
@media (max-width:420px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.wide{grid-column:1/-1}
.card.hot{border-color:var(--bad)}
.ct{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.ct h3{font:700 1.2rem/1.2 var(--display);margin:0}
.tag{font:700 .72rem var(--body);letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:var(--line);color:var(--ink);white-space:nowrap}
.tag.miss{background:var(--bad);color:var(--bg)}
.tag.ps{background:var(--warn-soft);color:var(--warn)}
.rule{font:700 1.12rem/1.3 var(--display);color:var(--accent)}
.vis{border-radius:12px;background:var(--bg);padding:12px;overflow-x:auto;display:flex;flex-direction:column;gap:8px}
.flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.b{min-width:0;overflow-wrap:anywhere;border:2px solid var(--line);border-radius:10px;padding:6px 10px;font:700 .9rem var(--display);background:var(--surface);text-align:center}
.b small{display:block;font:400 .78rem var(--body);color:var(--muted)}
.b.g{border-color:var(--good);background:var(--good-soft)}
.b.r{border-color:var(--bad);background:var(--bad-soft)}
.b.a{border-color:var(--accent);background:var(--accent-soft)}
.ar{font:700 1.2rem var(--display);color:var(--muted)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.two>.b{display:flex;flex-direction:column;justify-content:center}
pre.code{font:500 .8rem/1.5 var(--mono);margin:0;white-space:pre;overflow-x:auto}
table.t{border-collapse:collapse;font-size:.88rem;width:100%}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}
table.t th{font:700 .78rem var(--body);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.y{color:var(--good);font-weight:700}.n{color:var(--bad);font-weight:700}
.cues{display:flex;flex-wrap:wrap;gap:6px}
.cue{font-size:.85rem;background:var(--accent-soft);border-radius:8px;padding:2px 8px}
.trap{font-size:.92rem;background:var(--bad-soft);border-radius:10px;padding:8px 10px}
.trap b{color:var(--bad)}
details{border:2px dashed var(--accent);border-radius:12px;padding:8px 10px}
summary{cursor:pointer;font-weight:700;font-size:.95rem}
details p{margin-top:6px;color:var(--good);font-weight:700}
.tree{font:500 .82rem/1.65 var(--mono);white-space:pre;margin:0;overflow-x:auto}
.tree .me{color:var(--warn);font-weight:700}.tree .team{color:var(--good);font-weight:700}.tree .when{color:var(--accent);font-weight:700}.tree .dim{color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.85rem}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:12px;height:12px;border-radius:3px;display:inline-block}
.empty{color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
</style>

const MOVES=[["Key word first","Find “independent”, “test-driven”, “automatically”. Pick the answer that explains THAT word."],["Must always → mechanism","Hook, schema, tool_choice, allowed-tools, remove the tool. Never “add it to the prompt”."],["Lightest fix at the cause","Bad pick → better description. Vague → explicit criteria. Mixed parts → XML tags."],["Reject true-but-generic","“Context rot”, “plan first”: true in general, wrong when they skip the key word."],["Two answers work? Tie-break","Pick the most Claude-native one (agents, hooks, tools), unless the constraints say not to use Claude."],["Read “select N”","Some items can ask for more than one answer. Check the count on every item."]];
const TAGS={miss:["missed","miss"],guess:["guessed","miss"],ps:["practice-site only","ps"]};
const $=id=>document.getElementById(id);
let cur="d3";
try{const s=localStorage.getItem("cca-speed-tab");if(s&&DOM.some(d=>d.id===s))cur=s}catch(e){}
const h=location.hash.slice(1);if(DOM.some(d=>d.id===h))cur=h;
function card(c,showDom){const tg=TAGS[c.tag]||["",""];const dn=showDom?`<span class="tag">${DOM.find(d=>d.id===c.d).n.split(" ")[0]}</span>`:"";
 return `<article class="card${c.wide?" wide":""}${c.tag==="miss"?" hot":""}"><div class="ct"><h3>${c.t}</h3><span>${dn} <span class="tag ${tg[1]}">${tg[0]}</span></span></div>
<p class="rule">${c.r}</p><div class="vis">${c.v}</div>
<div class="cues">${c.c.map(x=>`<span class="cue">“${x}”</span>`).join("")}</div>
<p class="trap"><b>Trap:</b> ${c.x}</p>
<details><summary>Apply it: ${c.a[0]}</summary><p>${c.a[1]}</p></details></article>`}
function tabs(){$("tabs").innerHTML=DOM.map(d=>{const n=C.filter(c=>c.d===d.id&&c.tag!=="ps").length;return `<button class="tab" role="tab" type="button" aria-selected="${!$("q").value&&d.id===cur}" data-id="${d.id}">${d.n.split(" ")[0]} <span style="font-weight:500">${d.n.split(" ").slice(1).join(" ")}</span><span class="n">${n}</span></button>`}).join("");
 $("tabs").querySelectorAll(".tab").forEach(b=>b.onclick=()=>{cur=b.dataset.id;$("q").value="";try{localStorage.setItem("cca-speed-tab",cur)}catch(e){}try{history.replaceState(null,"","#"+cur)}catch(e){}render();window.scrollTo(0,0)})}
function render(){tabs();const q=$("q").value.trim().toLowerCase();
 let html=`<div class="moves">${MOVES.map(m=>`<div class="move"><b>${m[0]}.</b> ${m[1]}</div>`).join("")}</div>`;
 if(q){const hit=C.filter(c=>(c.t+" "+c.r+" "+c.c.join(" ")+" "+c.x+" "+c.v.replace(/<[^>]+>/g," ")).toLowerCase().includes(q));
  html+=`<h2 class="dh">${hit.length} card${hit.length===1?"":"s"} for “${q.replace(/</g,"&lt;")}”</h2>`+(hit.length?`<div class="grid">${hit.map(c=>card(c,1)).join("")}</div>`:`<p class="empty">No card matches. Try one word, like glob, hook, schema or resume.</p>`)}
 else{const d=DOM.find(x=>x.id===cur);html+=`<h2 class="dh">${d.n} · ${d.w}<small>${d.note}</small></h2><div class="grid">${C.filter(c=>c.d===cur).map(c=>card(c,0)).join("")}</div>`}
 $("main").innerHTML=html}
$("q").addEventListener("input",render);
addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(DOM.some(d=>d.id===h)){cur=h;$("q").value="";render()}});
render();
</script>
